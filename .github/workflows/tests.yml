name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, mbstring, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Keep test modules out of production
        run: node -e "const m=require('./public/build/manifest.json');if(Object.keys(m).some(k=>k.includes('.test.')))process.exit(1)"
      - run: php artisan test
